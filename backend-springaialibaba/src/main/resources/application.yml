server:
  port: 8099

spring:
  application:
    name: gov-service-assistant
  ai:
    dashscope:
      api-key: sk-058f8d1651c24eb1bb579d55a8119581
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
      # 使用 DashScope 默认基础地址，避免与 Spring AI Alibaba 的 REST 路径重复拼接
      # base-url: https://dashscope.aliyuncs.com

  datasource:
    url: jdbc:h2:mem:govassistant
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  document:
    storage-path: ./data/documents
  ai:
    system-prompt-resource: classpath:/prompt/system-prompt.txt
  security:
    token-secret: ${APP_SECURITY_TOKEN_SECRET:gov-service-assistant-local-secret}
    token-ttl-seconds: 28800
    default-admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}
  rag:
    top-k: 5
    similarity-threshold: 0.35

logging:
  level:
    com.gov.assistant: INFO
