server:
  port: 8099

spring:
  application:
    name: gov-service-assistant

  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  datasource:
    url: jdbc:h2:mem:govassistant
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

langchain4j:
  dashscope:
    api-key: sk-058f8d1651c24eb1bb579d55a8119581
    model-name: qwen-plus
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

# 国资监管业务配置
gov:
  assistant:
    # 人工转接阈值
    human-handoff-threshold: 0.7
    # 会话超时时间（分钟）
    session-timeout: 30
    # 知识库路径
    knowledge-base-path: classpath:/knowledge/
    # 文档存储路径
    document-storage-path: ./data/document-knowledge
    # OCR命令（默认使用tesseract，可按环境调整）
    ocr-command: /usr/local/bin/tesseract
    # 意图识别配置
    intent-recognition:
      policy-consultation: "政策咨询"
      business-processing: "业务办理"
      progress-query: "进度查询"
      technical-support: "技术支持"
      account-permission: "账号权限"
      complaint-suggestion: "投诉建议"

# 日志配置
logging:
  level:
    "[com.gov.assistant]": DEBUG
    "[dev.langchain4j]": DEBUG
